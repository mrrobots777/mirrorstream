name: testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: instalar dependências
        run: npm ci --no-audit --no-fund
      - name: validar sintaxe
        run: |
          set -e
          for f in $(find src tools -name '*.js') build.js teste.js; do node --check "$f"; done
      - name: executar testes do plugin
        run: npm test
      - name: construir bundles
        run: npm run build
      # O aparelho NAO roda Node: e' um motor embarcado com uma lista fechada do que existe
      # (sem process, sem Buffer, sem modulos Node, sem DOM, sem eval, corpo <= 1 MB, 60 s por
      # fonte). Um bundle pode passar em `npm test` e estourar no celular, entao os MESMOS
      # arquivos de `dist/` sao carregados num contexto que reproduz a lista fechada. E' o
      # que garante celular e TV: o mesmo codigo, sem caminho alternativo por aparelho.
      - name: conferir os bundles contra o sandbox do aparelho
        run: npm run sandbox
