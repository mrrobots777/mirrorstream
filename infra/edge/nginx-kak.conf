# O nginx NA FRENTE do painel do KAK, servindo de CDN.
#
# POR QUE ISTO EXISTE (medido, nao teoria):
#
# O painel (206.109.57.195) recusa conexao. Medido: 1->1/1, 2->2/2, 3->2/3 (403 em 545ms),
# 4->1/4. Duas conexoes simultaneas. Duas formas de recusar: 403 rapido, e 200 com corpo
# VAZIO depois de 11,3s (a conexao trava). A origem entrega 26 Mbps, o que da ~8-9 canais.
#
# O limite e de CONCORRENCIA, nao de vazao. E por isso que o modelo antigo (uma fila com 2
# buscas em paralelo, em rajada) e o pior formato possivel contra ele: 3 pedidos juntos
# parecem 3 conexoes, mesmo vindo do mesmo processo.
#
# O nginx resolve as tres coisas de uma vez, e e o mesmo desenho que o site da ETC usa:
#
#   1. POOL DE CONEXOES VIVAS. `keepalive 4` no upstream significa que o painel ve no
#      maximo 4 conexoes TCP mantidas vivas, para sempre. Nao existe mais uma conexao por
#      pedido. Nunca ha rajada.
#   2. TRAVA DE CACHE POR ARQUIVO (`proxy_cache_lock`). Quando N pessoas pedem o mesmo
#      segmento novo ao mesmo tempo, so o PRIMEIRO vai a origem; os outros esperam e leem do
#      disco. O painel ve 1 pedido por arquivo, independente de quantas pessoas assistem.
#      Esta e a peca que mais importa, e e de graca.
#   3. CACHE EM DISCO com fatia de 1 MB (`slice 1m`), que e o que faz o cache funcionar
#      com requisicao de intervalo (Range), que e como os players HLS pedem.
#
# O QUE ISTO NAO FAZ, e e preciso ser claro: nao aumenta quantos canais DIFERENTES o painel
# entrega ao mesmo tempo. Isso e a banda da origem (26 Mbps) e o limite de 2 conexoes, e
# nenhum servidor web muda. O que muda e o numero de vezes que a origem e chamada: de "uma
# por espectador" para "uma por canal a cada 10s", que e o minimo fisico possivel.
#
# SOBRE "MASCARAR": o painel continua vendo este IP e continua vendo toda falha de cache. O
# que muda nao e esconder quem pede, e fazer com que quase nao haja o que pedir. E o efeito
# correto: a metrica de recusa cai porque a origem para de ser martelada, nao porque o
# pedido ficou invisivel.

# --- disco de cache -----------------------------------------------------------
# 12 GB. Um segmento tem 3,8 MB e cada canal gera um novo a cada ~10s, entao o cache roda
# em ciclo: o que nao e pedido ha muito tempo sai por `inactive`. O que importa e guardar os
# canais quentes, nao o catalogo inteiro dos 733.
proxy_cache_path /var/cache/nginx/kak
    levels=1:2
    keys_zone=kak:64m
    max_size=12g
    inactive=15m
    use_temp_path=off;

# --- o painel, atras do nginx -------------------------------------------------
# keepalive 4: o painel ve no maximo 4 conexoes vivas, para sempre. O limite real do painel
# e ~2, entao 4 e folga para o lock: enquanto uma conexao trava esperando o lock do cache,
# ja existe outra livre.
upstream kak_painel {
    server 206.109.57.195:80;
    keepalive 4;
    keepalive_requests 2000;
    keepalive_timeout 75s;
}

server {
    listen 8443 default_server;
    server_name _;

    # Sem log de acesso: um canal abre ~6 pedidos por minuto e nao ha ganho em poluir o disco.
    access_log off;
    error_log /var/log/nginx/kak-error.log warn;

    # O relay continua funcionando, so que agora atras do nginx.
    location = /token        { proxy_pass http://127.0.0.1:8444; proxy_set_header Connection ""; }
    location = /pl-stats     { proxy_pass http://127.0.0.1:8444; proxy_set_header Connection ""; }
    location ~ ^/pl/verificar { proxy_pass http://127.0.0.1:8444; proxy_set_header Connection ""; }

    # A lista e ao VIVO: precisa ser fresca. Cache curtissimo, de 2 segundos, so para
    # absorver dois pedidos simultaneos do mesmo canal (montar a lista e montar o player).
    location /pl/ {
        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Connection "";
        proxy_cache kak;
        proxy_cache_key "pl$uri";
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 12s;
        add_header X-Mirror-Cache $upstream_cache_status always;
    }

    # --- A CDN ------------------------------------------------------------------
    # O endereco vem do app com o token no caminho:
    #   /cdn/hlsr/<token>/USUARIO_DO_PAINEL/SENHA_DO_PAINEL/<canal>/<md5>/<canal>_<n>.ts
    #
    # A CHAVE DE CACHE TIRA O TOKEN. Isto e obrigatorio e nao e detalhe: o token gira com o
    # tempo, e ele esta dentro do caminho. Se a chave fosse o endereco inteiro, cada rotacao
    # de token zeraria o cache e o painel seria chamado de novo para o mesmo arquivo. O que
    # identifica o arquivo e o md5 do conteudo mais o nome, e isso nao muda nunca.
    # SO o caminho de midia. Sem esta restricao o /cdn/ seria um proxy aberto para o painel:
    # qualquer pedido viraria uma chamada na conta do dono. O caminho tem que ser
    # /cdn/hlsr/<token>/USUARIO_DO_PAINEL/... — o mesmo que o ALVO_KAK do app ja exige.
    location ~ ^/cdn/hlsr/[^/]+/USUARIO_DO_PAINEL/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 206.109.57.195;

        set $kak_chave "-";
        if ($uri ~ "^/cdn/hlsr/[^/]+(?<kak_estavel>/USUARIO_DO_PAINEL/[^?]+)$") {
            set $kak_chave $kak_estavel;
        }
        proxy_cache_key "kak$kak_chave";

        # Tira o /cdn do caminho. Nao da para fazer isso com a barra do `proxy_pass`, porque
        # agora a location e de expressao regular e o nginx nao aceita URI nessa situacao
        # (erro: "proxy_pass cannot have URI part in location given by regular
        # expression"). O `rewrite ... break` faz o mesmo servico: a origem recebe
        # /hlsr/... em vez de /cdn/hlsr/... (que daria 404, medido).
        rewrite ^/cdn(?<kak_rest>/.*)$ $kak_rest break;
        proxy_pass http://kak_painel;

        proxy_cache kak;
        proxy_cache_methods GET;
        # A PECA PRINCIPAL: um por arquivo. O painel ve 1 pedido, nao um por espectador.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 25s;
        proxy_cache_lock_age 25s;

        # SEM `slice`, de proposito. Medido: com fatia de 1 MB o nginx pedia o segmento a
        # origem uma vez POR FATIA (3 pedidos para um arquivo de 2,88 MB) e devolvia 200
        # inteiro para um pedido de Range. Como o painel so libera ~2 conexoes, 3 pedidos
        # por arquivo e o pior formato possivel. Cacheando o arquivo inteiro: uma ida a
        # origem, e o Range sai 206 de verdade, montado a partir do que esta em disco.
        # SO o 200 entra em cache. Guardar 403/404 (eu tinha 5s) e perigoso: o painel recusa
        # de forma momentanea, e guardar a recusa transformava um tropeco em um estado
        # grudento — medido: `X-Mirror-Cache: STALE` devolvendo 403, ou seja, o nginx
        # servindo um erro guardado enquanto a origem ja tinha se recuperado. Recusa nao se
        # guarda; a proxima tentativa tem de ir a origem de novo.
        proxy_cache_valid 200 40m;

        # Se a origem travar, entrega o que tem em vez de perder a audio e o video.
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # Range no cliente tambem, montado a partir das fatias. Em nginx livre o nome e
        # `max_ranges` (sem o prefixo `proxy_`, que e so do nginx-plus).
        max_ranges 16;

        add_header X-Mirror-Cache $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Qualquer outro pedido sob /cdn/ e recusado, nao repassado ao painel.
    location /cdn/ { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Connection "";
    }
}
