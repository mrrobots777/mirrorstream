# Nginx NA FRENTE DO ADDON, ATRAS DO TUNEL (decisao 149)
#
# POR QUE ISTO EXISTE. MEDIDO 01/10/2026: o endereco do cluster de TV no BeamUp
# (c12e41ddc21b-mirror2) PERDEU o registro no DNS e passou a cair no wildcard — sem aviso e sem
# erro no log. Como o gateway do BeamUp reescreve o Host para o nome do app, o codigo nao tem como
# recuperar um endereco que o DNS nao devolve. A pagina do addon passou a levar 12,8s (o gateway
# corta em 12,3s) e o dono viu "o addon caiu".
#
# O TUNEL NAO PRECISA DESTE NGINX para funcionar: o `cloudflared` fala direto com a origem e ja
# entrega WAF + DDoS. O nginx aqui e para o caso de voce QUERER um nome seu (ex.: addon.seudominio.com)
# — e nesse caso ele e quem termina o nome e repassa para o tunnel. Sem ele, use o endereco
# `<id>.cfargotunnel.com`, que e fixo e so funciona em IPv6 (a Cloudflare nao devolve registro A).
#
# O QUE ISTO NAO RESOLVE: os 403 das origens de TV. MEDIDO, o worker do Cloudflare chega na origem e
# ela responde "Upstream 403" — as origens barram IP de datacenter E o edge da Cloudflare. O video e'
# baixado pelo aparelho de quem assiste, do IP residencial de quem assiste.
#
# INSTALACAO
#   sudo cp deploy/nginx-tunel.conf /etc/nginx/sites-available/mirror-tunel
#   sudo ln -sf /etc/nginx/sites-available/mirror-tunel /etc/nginx/sites-enabled/mirror-tunel
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# O video NAO passa por aqui: o addon entrega link direto da origem e o aparelho de quem assiste
# baixa direto dela. Por isso este nginx so carrega o catalogo e o JSON (65KB-660KB).

# O tunnel local. O cloudflared escuta em 127.0.0.1 (veja o service ao lado).
upstream mirror_tunel {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name addon.seudominio.com tv.seudominio.com;

    # HTTP so para o certificado. Quem nao pedir certificado cai na regra de baixo.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name addon.seudominio.com tv.seudominio.com;

    # Let's Encrypt: troque pelo caminho que o seu `certbot` usar.
    ssl_certificate     /etc/letsencrypt/live/SEUDOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEUDOMINIO/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # O catalogo de TV com `date` chega a 660KB; e JSON, nao video.
    client_max_body_size 2m;

    location / {
        proxy_pass http://mirror_tunel;
        proxy_http_version 1.1;

        # O `Host` que o cloudflared espera e o nome do TUNEL, nao o seu nome. Sem esta linha o
        # addon responde 404 do proprio tunnel.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        # O gateway do BeamUp corta em ~12,3s e o addon tem teto proprio de 9s. Este valor tem de
        # ficar ACIMA do tempo de resposta, nunca abaixo: o nginx cortando antes do app da tempo de
        # erro 504 que parece "fonte caiu", e foi exatamente assim que o dono perdeu o dia.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
    }
}